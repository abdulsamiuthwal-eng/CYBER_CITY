<!-- CyberCity 2050 — Custom Designed SVG Icon Sprite -->
<!-- Each icon is a custom-designed SVG, NO emojis used -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" id="cc-icons">
  <defs>

    <!-- 
    ╔══════════════════════════════════════════╗
    ║  ICON: leaf  (nav logo + environment)   ║
    ╚══════════════════════════════════════════╝
    Custom stylized leaf with circuit vein lines 
    -->
    <symbol id="icon-leaf" viewBox="0 0 32 32" fill="none">
      <path d="M16 3 C8 3 3 10 4 19 C5 25 10 29 16 29 C22 29 28 24 28 18 C28 10 22 3 16 3 Z" 
            fill="currentColor" opacity="0.15"/>
      <path d="M16 3 C8 3 3 10 4 19 C5 25 10 29 16 29 C22 29 28 24 28 18 C28 10 22 3 16 3 Z" 
            stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- center vein -->
      <line x1="16" y1="3" x2="16" y2="29" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 2"/>
      <!-- side veins -->
      <path d="M16 10 L10 15" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
      <path d="M16 14 L10 19" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
      <path d="M16 18 L11 23" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
      <path d="M16 10 L22 15" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
      <path d="M16 14 L22 19" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
      <path d="M16 18 L21 23" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
      <!-- circuit dots -->
      <circle cx="10" cy="15" r="1.5" fill="currentColor"/>
      <circle cx="22" cy="15" r="1.5" fill="currentColor"/>
    </symbol>

    <!-- 
    ╔══════════════════════════════════════════╗
    ║  ICON: people  (population stat)        ║
    ╚══════════════════════════════════════════╝
    Two futuristic humanoid silhouettes with signal arcs
    -->
    <symbol id="icon-people" viewBox="0 0 32 32" fill="none">
      <!-- person left -->
      <circle cx="11" cy="9" r="4" stroke="currentColor" stroke-width="1.8"/>
      <path d="M4 26 C4 20 7 17 11 17 C13 17 15 18 16.5 20" 
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <!-- person right -->
      <circle cx="21" cy="9" r="4" stroke="currentColor" stroke-width="1.8"/>
      <path d="M28 26 C28 20 25 17 21 17 C19 17 17.5 18 16.5 20" 
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <!-- signal arc (futuristic overlay) -->
      <path d="M13.5 4.5 A5 5 0 0 1 18.5 4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <!-- bottom connector bar -->
      <line x1="4" y1="28" x2="28" y2="28" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3"/>
    </symbol>

    <!-- 
    ╔══════════════════════════════════════════╗
    ║  ICON: bolt  (energy / lightning)       ║
    ╚══════════════════════════════════════════╝
    Stylized hexagonal lightning bolt with circuit nodes
    -->
    <symbol id="icon-bolt" viewBox="0 0 32 32" fill="none">
      <!-- hex background ring -->
      <path d="M16 2 L24 7 L24 17 L16 22 L8 17 L8 7 Z" 
            stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
      <!-- lightning bolt -->
      <path d="M19 3 L11 16 L16 16 L13 29 L21 15 L16 15 Z" 
            fill="currentColor" opacity="0.2"/>
      <path d="M19 3 L11 16 L16 16 L13 29 L21 15 L16 15 Z" 
            stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- energy particles -->
      <circle cx="7" cy="12" r="1.5" fill="currentColor" opacity="0.5"/>
      <circle cx="25" cy="12" r="1.5" fill="currentColor" opacity="0.5"/>
      <circle cx="7" cy="20" r="1" fill="currentColor" opacity="0.3"/>
      <circle cx="25" cy="20" r="1" fill="currentColor" opacity="0.3"/>
    </symbol>

    <!-- 
    ╔══════════════════════════════════════════╗
    ║  ICON: robot  (AI droids)               ║
    ╚══════════════════════════════════════════╝
    Sleek geometric robot head with scan lines
    -->
    <symbol id="icon-robot" viewBox="0 0 32 32" fill="none">
      <!-- antenna -->
      <line x1="16" y1="2" x2="16" y2="7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="16" cy="2" r="1.5" fill="currentColor"/>
      <!-- head -->
      <rect x="6" y="7" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.8"/>
      <!-- eyes -->
      <rect x="9" y="11" width="5" height="4" rx="1" fill="currentColor" opacity="0.2"/>
      <rect x="9" y="11" width="5" height="4" rx="1" stroke="currentColor" stroke-width="1.2"/>
      <rect x="18" y="11" width="5" height="4" rx="1" fill="currentColor" opacity="0.2"/>
      <rect x="18" y="11" width="5" height="4" rx="1" stroke="currentColor" stroke-width="1.2"/>
      <!-- eye glow lines -->
      <line x1="11.5" y1="13" x2="11.5" y2="13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="20.5" y1="13" x2="20.5" y2="13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <!-- mouth/speaker grille -->
      <line x1="10" y1="19.5" x2="14" y2="19.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="11" y1="21" x2="13" y2="21" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <!-- neck + body stub -->
      <rect x="13" y="23" width="6" height="3" rx="1" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10 26 L6 30 L26 30 L22 26" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- 
    ╔══════════════════════════════════════════╗
    ║  ICON: seedling  (air quality / env)    ║
    ╚══════════════════════════════════════════╝
    Sprouting plant with data sensor ring
    -->
    <symbol id="icon-seedling" viewBox="0 0 32 32" fill="none">
      <!-- sensor ring -->
      <circle cx="16" cy="16" r="12" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.35"/>
      <!-- stem -->
      <path d="M16 26 L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <!-- left leaf -->
      <path d="M16 18 C13 16 9 17 9 21 C9 21 13 22 16 18 Z" 
            fill="currentColor" opacity="0.2"/>
      <path d="M16 18 C13 16 9 17 9 21 C9 21 13 22 16 18 Z" 
            stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- right leaf -->
      <path d="M16 14 C19 12 23 13 23 17 C23 17 19 18 16 14 Z" 
            fill="currentColor" opacity="0.2"/>
      <path d="M16 14 C19 12 23 13 23 17 C23 17 19 18 16 14 Z" 
            stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- ground line -->
      <path d="M10 26 Q13 28 16 26 Q19 24 22 26" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <!-- data tick marks on ring -->
      <line x1="16" y1="4" x2="16" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="28" y1="16" x2="26" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="16" x2="6" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- 
    ╔══════════════════════════════════════════╗
    ║  ICON: train  (smart transport)         ║
    ╚══════════════════════════════════════════╝
    Futuristic maglev train silhouette with speed lines
    -->
    <symbol id="icon-train" viewBox="0 0 32 32" fill="none">
      <!-- speed lines (behind) -->
      <line x1="2" y1="14" x2="8" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
      <line x1="2" y1="17" x2="6" y2="17" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.2"/>
      <line x1="2" y1="20" x2="8" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
      <!-- train body -->
      <path d="M8 10 L26 10 Q30 10 30 14 L30 22 Q30 24 28 24 L8 24 Q5 24 5 21 L5 13 Q5 10 8 10 Z" 
            fill="currentColor" opacity="0.1"/>
      <path d="M8 10 L26 10 Q30 10 30 14 L30 22 Q30 24 28 24 L8 24 Q5 24 5 21 L5 13 Q5 10 8 10 Z" 
            stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- windows row -->
      <rect x="8" y="12.5" width="5" height="5" rx="1.5" fill="currentColor" opacity="0.15"/>
      <rect x="8" y="12.5" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
      <rect x="15" y="12.5" width="5" height="5" rx="1.5" fill="currentColor" opacity="0.15"/>
      <rect x="15" y="12.5" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
      <rect x="22" y="12.5" width="5" height="5" rx="1.5" fill="currentColor" opacity="0.15"/>
      <rect x="22" y="12.5" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
      <!-- maglev rail -->
      <line x1="2" y1="26" x2="30" y2="26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="2" y1="28" x2="30" y2="28" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/>
      <!-- nose highlight -->
      <path d="M28 13 L29.5 16 L28 19" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    </symbol>

    <!-- 
    ╔══════════════════════════════════════════╗
    ║  ICON: shield  (AI security)            ║
    ╚══════════════════════════════════════════╝
    Hexagonal shield with scan beam & circuit pattern
    -->
    <symbol id="icon-shield" viewBox="0 0 32 32" fill="none">
      <!-- shield outline -->
      <path d="M16 2 L28 7 L28 17 C28 23 22 28 16 30 C10 28 4 23 4 17 L4 7 Z" 
            fill="currentColor" opacity="0.08"/>
      <path d="M16 2 L28 7 L28 17 C28 23 22 28 16 30 C10 28 4 23 4 17 L4 7 Z" 
            stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- inner hex badge -->
      <path d="M16 8 L21 11 L21 17 L16 20 L11 17 L11 11 Z" 
            stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
      <!-- scan line -->
      <line x1="8" y1="16" x2="24" y2="16" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2" opacity="0.4"/>
      <!-- checkmark -->
      <path d="M11.5 16 L14.5 19 L20.5 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- 
    ╔══════════════════════════════════════════╗
    ║  ICON: city (skyline)                   ║
    ╚══════════════════════════════════════════╝
    Futuristic city skyline with antenna + grid lines
    -->
    <symbol id="icon-city" viewBox="0 0 32 32" fill="none">
      <!-- base grid -->
      <line x1="2" y1="28" x2="30" y2="28" stroke="currentColor" stroke-width="1.5"/>
      <!-- building far left -->
      <rect x="2" y="18" width="5" height="10" fill="currentColor" opacity="0.1"/>
      <rect x="2" y="18" width="5" height="10" stroke="currentColor" stroke-width="1.2"/>
      <!-- building left-mid -->
      <rect x="8" y="13" width="6" height="15" fill="currentColor" opacity="0.1"/>
      <rect x="8" y="13" width="6" height="15" stroke="currentColor" stroke-width="1.2"/>
      <!-- windows left-mid -->
      <rect x="9.5" y="15" width="2" height="2" fill="currentColor" opacity="0.5"/>
      <rect x="12.5" y="15" width="1" height="2" fill="currentColor" opacity="0.5"/>
      <!-- main center tower -->
      <rect x="15" y="7" width="7" height="21" fill="currentColor" opacity="0.12"/>
      <rect x="15" y="7" width="7" height="21" stroke="currentColor" stroke-width="1.8"/>
      <!-- antenna on center tower -->
      <line x1="18.5" y1="7" x2="18.5" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="18.5" cy="2" r="1.2" fill="currentColor"/>
      <!-- center tower windows -->
      <rect x="16.5" y="9" width="2" height="2" fill="currentColor" opacity="0.5"/>
      <rect x="19.5" y="9" width="1.5" height="2" fill="currentColor" opacity="0.5"/>
      <rect x="16.5" y="13" width="2" height="2" fill="currentColor" opacity="0.5"/>
      <rect x="19.5" y="13" width="1.5" height="2" fill="currentColor" opacity="0.5"/>
      <!-- building right -->
      <rect x="23" y="16" width="7" height="12" fill="currentColor" opacity="0.1"/>
      <rect x="23" y="16" width="7" height="12" stroke="currentColor" stroke-width="1.2"/>
    </symbol>

    <!-- 
    ╔══════════════════════════════════════════╗
    ║  ICON: globe  (city network)            ║
    ╚══════════════════════════════════════════╝
    Wireframe globe with network node dots
    -->
    <symbol id="icon-globe" viewBox="0 0 32 32" fill="none">
      <!-- outer circle -->
      <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.8"/>
      <!-- equator -->
      <ellipse cx="16" cy="16" rx="13" ry="5" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
      <!-- meridian lines -->
      <ellipse cx="16" cy="16" rx="7" ry="13" stroke="currentColor" stroke-width="1" opacity="0.4"/>
      <!-- vertical poles -->
      <line x1="16" y1="3" x2="16" y2="29" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3" opacity="0.3"/>
      <!-- horizontal latitudes -->
      <ellipse cx="16" cy="11" rx="11" ry="3" stroke="currentColor" stroke-width="1" opacity="0.25"/>
      <ellipse cx="16" cy="21" rx="11" ry="3" stroke="currentColor" stroke-width="1" opacity="0.25"/>
      <!-- network node dots -->
      <circle cx="10" cy="11" r="2" fill="currentColor"/>
      <circle cx="22" cy="11" r="2" fill="currentColor"/>
      <circle cx="8" cy="19" r="2" fill="currentColor"/>
      <circle cx="24" cy="19" r="2" fill="currentColor"/>
      <circle cx="16" cy="8" r="2" fill="currentColor"/>
      <!-- connection lines -->
      <line x1="10" y1="11" x2="22" y2="11" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
      <line x1="10" y1="11" x2="8" y2="19" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
      <line x1="22" y1="11" x2="24" y2="19" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
      <line x1="8" y1="19" x2="24" y2="19" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
      <line x1="16" y1="8" x2="10" y2="11" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
      <line x1="16" y1="8" x2="22" y2="11" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
    </symbol>

    <!-- 
    ╔══════════════════════════════════════════╗
    ║  ICON: check  (feature list checkmark)  ║
    ╚══════════════════════════════════════════╝
    Geometric hexagonal check badge
    -->
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none">
      <path d="M12 2 L20 6 L20 14 C20 18 16 21 12 22 C8 21 4 18 4 14 L4 6 Z" 
            fill="currentColor" opacity="0.1"/>
      <path d="M12 2 L20 6 L20 14 C20 18 16 21 12 22 C8 21 4 18 4 14 L4 6 Z" 
            stroke="currentColor" stroke-width="1.5"/>
      <path d="M8 12 L11 15 L16 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- 
    ╔══════════════════════════════════════════╗
    ║  ICON: play  (watch trailer button)     ║
    ╚══════════════════════════════════════════╝
    Hexagonal play button with signal rings
    -->
    <symbol id="icon-play" viewBox="0 0 32 32" fill="none">
      <!-- outer signal ring -->
      <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4" opacity="0.25"/>
      <!-- button circle -->
      <circle cx="16" cy="16" r="11" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="16" cy="16" r="11" fill="currentColor" opacity="0.08"/>
      <!-- play triangle -->
      <path d="M13 11 L23 16 L13 21 Z" fill="currentColor" opacity="0.3"/>
      <path d="M13 11 L23 16 L13 21 Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>

  </defs>
</svg>